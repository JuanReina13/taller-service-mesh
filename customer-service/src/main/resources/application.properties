spring.application.name=customer-service
server.port=${SERVER_PORT:8081}

# ===============================
# DATABASE (en Kubernetes llegan por variables de entorno)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:customerdb}?createDatabaseIfNotExist=true&serverTimezone=GMT-5
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:UPTC2024}
spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.retries=1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ===============================
# OTROS MICROSERVICIOS
# ===============================
services.login.url=${LOGIN_SERVICE_URL:http://localhost:8083}
