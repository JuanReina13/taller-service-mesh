apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http # Istio usa el nombre del puerto para saber que el tráfico es HTTP
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
